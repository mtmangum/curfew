:root {
	--bg: #0b0d17;
	--bg2: #151b33;
	--gold: #ffd27a;
	--red: #ff5a4d;
	--dim: #9aa0b4;
	--ink: #e8ebf5;
	--lamp: #ffcf70;
	--k: 3;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--ink);
	background-color: var(--bg);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---- the loading page ---------------------------------------------------------------- */
#boot {
	position: absolute;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: space-between;
	background: linear-gradient(#070813 0%, var(--bg) 35%, var(--bg2) 100%);
	font-family: 'Pixelify', 'Courier New', monospace;
	font-variant-ligatures: none;
	font-feature-settings: 'liga' 0, 'clig' 0;
	overflow: hidden;
	transition: opacity 0.7s ease;
}

#boot.leaving {
	opacity: 0;
	pointer-events: none;
}

#stars {
	position: absolute;
	inset: 0 0 45% 0;
	pointer-events: none;
}

#stars i {
	position: absolute;
	width: 2px;
	height: 2px;
	background: #cfd6ff;
	opacity: 0.8;
	animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
	0%, 100% { opacity: 0.15; }
	50% { opacity: 0.95; }
}

.head {
	position: relative;
	margin-top: clamp(14px, 5vh, 56px);
	text-align: center;
	padding: 0 16px;
}

.title {
	font-family: 'Silkscreen', 'Pixelify', monospace;
	font-weight: 700;
	font-size: clamp(44px, 12vw, 96px);
	letter-spacing: 0.06em;
	margin: 0;
	color: var(--gold);
	text-shadow: 0 4px 0 #6a3a12, 0 0 28px rgba(255, 190, 90, 0.35);
	animation: flicker 5s linear infinite;
}

.title .pre {
	display: block;
	font-size: clamp(15px, 4.4vw, 32px);
	letter-spacing: 0.34em;
	margin: 0 0 0.35em 0.34em;
	color: #f3e7c8;
	text-shadow: 0 2px 0 #6a3a12, 0 0 16px rgba(255, 190, 90, 0.25);
}

@keyframes flicker {
	0%, 18%, 22%, 62%, 66%, 100% { opacity: 1; }
	20% { opacity: 0.55; }
	64% { opacity: 0.8; }
}

.tag {
	margin: 6px 0 0;
	font-size: clamp(14px, 3.4vw, 20px);
	color: var(--dim);
	letter-spacing: 0.04em;
}

/* the street: skyline, lamps, a cop with a torch, and the way home */
.street {
	position: relative;
	width: min(100%, 960px);
	height: clamp(190px, 38vh, 330px);
	margin-top: auto;
}

#skyline {
	position: absolute;
	left: 0;
	bottom: 14%;
	width: 100%;
	height: 78%;
	image-rendering: pixelated;
}

.pavement {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 16%;
	background: linear-gradient(#232845, #161a30);
	border-top: 2px solid #323964;
}

.lamp {
	position: absolute;
	bottom: 15%;
	width: 3px;
	height: 38%;
	background: #2b3050;
}

.lamp::after {
	content: '';
	position: absolute;
	top: -5px;
	left: -7px;
	width: 17px;
	height: 6px;
	background: var(--lamp);
	box-shadow: 0 0 22px 12px rgba(255, 207, 112, 0.28);
	border-radius: 3px;
}

.lamp.flick::after { animation: lampflick 4.5s linear infinite; }

/* (Safari runs steps() animations on the page's own thread, where they stall whenever the game is
   busy, so every jump here is a pair of keyframes a hair apart with linear timing instead.) */
@keyframes lampflick {
	0%, 41.9% { opacity: 1; }
	42%, 43.9% { opacity: 0.25; }
	44%, 100% { opacity: 1; }
}

.sprite {
	position: absolute;
	bottom: 2%;
	image-rendering: pixelated;
	width: auto;
}

/* The cop starts at the far end from the house, facing away with his torch beam sweeping the
   other way (class flip = facing left). Once Nicole has set off he notices, turns, and runs
   after her with his torch out and his club swinging (class chasing), always a little way
   behind. The beam starts at the lens of the torch drawn over his hand (#torch), so the wrapper
   is sized to the sprite. */
#copwrap {
	position: absolute;
	left: 0;
	bottom: 9%;
	height: calc(30px * var(--k));
	width: calc(18.75px * var(--k));
	will-change: transform;
	transition: transform 1.1s linear;
}

/* Nothing of a character shows until its pictures have decoded: the torch, club, beam and leash are
   drawn in CSS, so without this they would sit there alone for a moment before the sprites arrive. */
#copwrap, #walkers { visibility: hidden; }
#copwrap.ready, #walkers.ready { visibility: visible; }

#copbody { position: absolute; inset: 0; }
#copbody.flip { transform: scaleX(-1); }
#copbody.chasing #beam { width: calc(80px * var(--k)); animation: chasebeam 0.34s ease-in-out infinite alternate; }
#copbody.chasing #cop { display: none; }
#coprun { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }
#copbody.chasing #coprun { display: block; animation: run-bob 0.22s linear infinite; }

/* A walk cycle: the frames are stacked in one place and take turns being visible. The turns are
   plain linear keyframes (no steps(): Safari runs those on the page's own thread, where they
   stall while the game is busy), and each frame stays up a hair past its turn so that it is
   always covered by the next one: there is never a moment with no frame showing. Negative
   delays start every frame mid-cycle, so none has a waiting period with a surprise state. */
.cycle img {
	position: absolute;
	left: 0;
	bottom: 0;
	height: 100%;
	width: auto;
	opacity: 0;
	image-rendering: pixelated;
	will-change: opacity;
	animation-duration: var(--period);
	animation-delay: calc(var(--i) * var(--period) / var(--n) - var(--period));
	animation-iteration-count: infinite;
	animation-timing-function: linear;
}
.cycle.n4 img { animation-name: frame4; }
.cycle.n6 img { animation-name: frame6; }

@keyframes frame4 { 0%, 26% { opacity: 1; } 26.1%, 100% { opacity: 0; } }
@keyframes frame6 { 0%, 18% { opacity: 1; } 18.1%, 100% { opacity: 0; } }
}


@keyframes chasebeam {
	0% { transform: rotate(-7deg); }
	100% { transform: rotate(5deg); }
}

@keyframes run-bob {
	0%, 49.9% { transform: translateY(0); }
	50%, 99.9% { transform: translateY(calc(-2px * var(--k))); }
	100% { transform: translateY(0); }
}
}

#alert {
	position: absolute;
	left: 30%;
	top: -34%;
	font-family: 'Silkscreen', monospace;
	font-weight: 700;
	font-size: calc(9px * var(--k));
	color: var(--red);
	text-shadow: 0 2px 0 #000;
	opacity: 0;
}

#alert.show { animation: alertpop 0.8s ease-out forwards; }

@keyframes alertpop {
	0% { opacity: 1; transform: translateY(0) scale(1.4); }
	70% { opacity: 1; transform: translateY(-4px) scale(1); }
	100% { opacity: 0; transform: translateY(-8px) scale(1); }
}

#cop {
	position: absolute;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	image-rendering: pixelated;
}

/* The torch he holds out in front of him: the sprite's own is only a couple of pixels, so this
   draws a proper one (a silver barrel with a bright lens) over his hand, and the beam starts at
   its lens. It goes when he starts running with his club out. */
#torch {
	position: absolute;
	left: 83%;
	top: calc(57.3% - 1.5px * var(--k));
	width: calc(6.4px * var(--k));
	height: calc(3px * var(--k));
	box-sizing: border-box;
	background: linear-gradient(#eef2fb, #9aa2b8 55%, #565d74);
	border: calc(0.6px * var(--k)) solid #151923;
	border-right: none;
}
#torch::after {
	content: '';
	position: absolute;
	right: calc(-1.5px * var(--k));
	top: -14%;
	width: calc(1.6px * var(--k));
	height: 128%;
	background: #fff6c8;
	box-shadow: 0 0 calc(7px * var(--k)) calc(2px * var(--k)) rgba(255, 238, 160, 0.75);
}

/* Running after her he keeps the torch out in front and swings his club from the other hand. */
#club {
	position: absolute;
	left: 15%;
	top: 64%;
	width: calc(2.4px * var(--k));
	height: calc(8.5px * var(--k));
	background: linear-gradient(90deg, #8a5a34, #4a2e1a);
	border: calc(0.5px * var(--k)) solid #1c120b;
	border-radius: calc(1.2px * var(--k));
	transform-origin: 50% 6%;
	display: none;
}
#copbody.chasing #club { display: block; animation: clubswing 0.3s ease-in-out infinite alternate; }

@keyframes clubswing {
	0% { transform: rotate(-42deg); }
	100% { transform: rotate(38deg); }
}

#beam {
	position: absolute;
	left: calc(83% + 7.6px * var(--k));
	top: 57.3%;
	width: calc(110px * var(--k));
	height: calc(56px * var(--k));
	margin-top: calc(-28px * var(--k));
	transform-origin: 0 50%;
	background: linear-gradient(90deg, rgba(255, 244, 200, 0.6), rgba(255, 244, 200, 0));
	clip-path: polygon(0 50%, 100% 8%, 100% 92%);
	animation: search 5.5s ease-in-out infinite;
}

@keyframes search {
	0%   { transform: rotate(-16deg); }
	22%  { transform: rotate(6deg); }
	45%  { transform: rotate(20deg); }
	68%  { transform: rotate(-2deg); }
	100% { transform: rotate(-16deg); }
}

#walkers {
	position: absolute;
	left: 0;
	bottom: 0;
	width: 0;
	height: 100%;
	will-change: transform;
	transition: transform 1.1s linear;
}

#walkers { z-index: 2; }
#walkers .sprite { bottom: 2%; }

#nicole { left: 0; height: calc(30px * var(--k)); }
#stella { left: calc(-34px * var(--k)); height: calc(15px * var(--k)); }

#leash {
	position: absolute;
	left: calc(-6px * var(--k));
	bottom: calc(2% + 11px * var(--k));
	width: calc(9px * var(--k));
	height: 2px;
	background: #d94d66;
}

#home {
	position: absolute;
	right: 1.5%;
	bottom: 14%;
	width: calc(24px * var(--k));
	height: calc(22px * var(--k));
}

#home .door {
	position: absolute;
	left: 40%;
	bottom: 0;
	width: 24%;
	height: 42%;
	background: #35280f;
	transition: background 0.4s, box-shadow 0.4s;
}

#boot.home #home .door {
	background: #ffd27a;
	box-shadow: 0 0 30px 14px rgba(255, 207, 112, 0.55);
}

#home .roof { position: absolute; left: 0; right: 0; top: 0; height: 36%; background: #402a2a; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
#home .wall { position: absolute; left: 6%; right: 6%; top: 34%; bottom: 0; background: #2a2038; }
#home .win { position: absolute; top: 48%; width: 18%; height: 18%; background: #e8c060; opacity: 0.75; }
#home .win.a { left: 14%; }
#home .win.b { right: 14%; }

/* the progress panel */
.panel {
	position: relative;
	width: min(92%, 640px);
	margin: 12px 0 clamp(12px, 4vh, 36px);
	padding: 12px 14px 10px;
	background: rgba(8, 10, 22, 0.72);
	border: 2px solid #323964;
	box-shadow: 0 0 0 2px #0a0c1a, 0 8px 24px rgba(0, 0, 0, 0.5);
}

.row {
	display: grid;
	grid-template-columns: minmax(96px, 140px) 1fr minmax(96px, 160px);
	align-items: center;
	gap: 10px;
	margin: 7px 0;
	opacity: 0.45;
	transition: opacity 0.3s;
}

.row.active, .row.done { opacity: 1; }

.row .label {
	font-family: 'Silkscreen', 'Pixelify', monospace;
	font-weight: 700;
	font-size: clamp(11px, 2.6vw, 14px);
	letter-spacing: 0.1em;
	color: var(--gold);
	white-space: nowrap;
}

.row.done .label { color: #7fd69a; }

.bar {
	position: relative;
	height: 14px;
	background: #05060f;
	border: 2px solid #3a4272;
	overflow: hidden;
}

.bar > b {
	position: absolute;
	inset: 0 auto 0 0;
	width: 100%;
	background: linear-gradient(#ffe29a, #f0a840);
	transform: scaleX(0);
	transform-origin: 0 50%;
	will-change: transform;
	transition: transform 0.6s ease-out;
}

.row.done .bar > b { background: linear-gradient(#a6efba, #4fae62); }

/* ten ticks, like the life meter in the game */
.bar::after {
	content: '';
	position: absolute;
	inset: 0;
	background: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 2px), rgba(0, 0, 0, 0.55) calc(10% - 2px), rgba(0, 0, 0, 0.55) 10%);
}

.row.working .bar > b {
	background: #f0a840;
	overflow: hidden;
}

.row.working .bar > b::before {
	content: '';
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: calc(100% + 22px);
	background: repeating-linear-gradient(45deg, #f0a840 0 8px, #ffe29a 8px 16px);
	background-size: 22px 22px;
	will-change: transform;
	animation: barber 0.7s linear infinite;
}

@keyframes barber { to { transform: translateX(-22px); } }

.row .detail {
	font-size: clamp(11px, 2.6vw, 14px);
	color: var(--dim);
	text-align: right;
	white-space: nowrap;
}

.tip {
	margin: 10px 2px 2px;
	min-height: 2.8em;
	text-align: center;
	font-size: clamp(13px, 3vw, 16px);
	color: #c9cfe6;
	transition: opacity 0.4s;
}

.slow {
	margin: 4px 2px 0;
	min-height: 1.3em;
	text-align: center;
	font-size: clamp(11px, 2.6vw, 13px);
	color: var(--dim);
}

#boot-notice {
	display: none;
	margin: 8px 0 2px;
	padding: 10px 12px;
	background: #5b3943;
	border: 1px solid #9b3943;
	color: #f1e6e8;
	text-align: center;
	font-size: 14px;
	line-height: 1.3;
	white-space: pre-line;
}

@media (max-width: 560px) {
	:root { --k: 2; }
	.row { grid-template-columns: 84px 1fr 70px; gap: 6px; }
	.row .detail { font-size: 10px; }
	.row .label { letter-spacing: 0.04em; }
}

@media (max-height: 520px) {
	.street { height: 130px; }
	.head { margin-top: 6px; }
}

@media (prefers-reduced-motion: reduce) {
	#stars i, .title, .lamp.flick::after, #beam, .row.working .bar > b, .cycle img { animation: none; }
	.cycle img:first-child { opacity: 1; }
}

	// How long a tip has to be on screen to be read: a moment to notice it, then about 25 characters a second.
	function readTime(text) { return Math.min(5000, 1200 + 40 * text.length); }
	const boot = document.getElementById('boot');

		s.style.animationDuration = (2 + Math.random() * 3) + 's';
		if (Math.random() < 0.2) { s.style.width = s.style.height = '3px'; }
		stars.appendChild(s);
	}

	// skyline: a row of dark buildings with lit windows, drawn once at low resolution
	(function drawSkyline() {
		const c = document.getElementById('skyline');
		const g = c.getContext('2d');
		let seed = 7;
		function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
		let x = 0;
		while (x < c.width) {
			const w = 18 + Math.floor(rnd() * 26);
			const h = 34 + Math.floor(rnd() * 60);
			const tone = 18 + Math.floor(rnd() * 14);
			g.fillStyle = 'rgb(' + tone + ',' + (tone + 4) + ',' + (tone + 24) + ')';
			g.fillRect(x, c.height - h, w, h);
			g.fillStyle = 'rgba(255,255,255,0.05)';
			g.fillRect(x, c.height - h, 2, h);
			for (let wy = c.height - h + 5; wy < c.height - 6; wy += 8) {
				for (let wx = x + 4; wx < x + w - 5; wx += 7) {
					if (rnd() < 0.38) {
						g.fillStyle = rnd() < 0.8 ? '#e8c060' : '#9fd0ff';
						g.globalAlpha = 0.45 + rnd() * 0.5;
						g.fillRect(wx, wy, 3, 4);
						g.globalAlpha = 1;
					}
				}
			}
			x += w + 1 + Math.floor(rnd() * 3);
		}
	}());

	// the characters
	const nicole = document.getElementById('nicole');
	const stella = document.getElementById('stella');
	const copImg = document.getElementById('cop');
	copImg.src = SPRITES.cop[0];
	const copWrap = document.getElementById('copwrap');
	const copBody = document.getElementById('copbody');
	const copRun = document.getElementById('coprun');
	const street = boot.querySelector('.street');
	let copChasing = false;
	const alertMark = document.createElement('div');
	alertMark.id = 'alert';
	alertMark.textContent = '!';
	copWrap.appendChild(alertMark);
	function startChase() {
		copChasing = true;
		copBody.classList.remove('flip');   // turns round...
		copBody.classList.add('chasing');   // ...and runs, club out
		alertMark.classList.add('show');
	}

	// Walk cycles: the frames are stacked and take turns being visible (see .cycle in the CSS),
	// 110 ms a frame, so they keep going while the game builds the city.
	function buildCycle(holder, frames) {
		holder.classList.add('n' + frames.length);
		holder.style.setProperty('--period', (frames.length * 110) + 'ms');
		holder.style.setProperty('--n', frames.length);
		const decoded = [];
		frames.forEach((src, i) => {
			const img = document.createElement('img');
			img.alt = '';
			img.src = src;
			img.style.setProperty('--i', i);
			holder.appendChild(img);
			decoded.push(decodeImage(img));
		});
		return Promise.all(decoded);
	}
	function decodeImage(img) {
		return img.decode ? img.decode().catch(() => {}) : new Promise((resolve) => { img.onload = img.onerror = resolve; });
	}
	const nicoleReady = buildCycle(nicole, SPRITES.nicole);
	const stellaReady = buildCycle(stella, SPRITES.stella);
	const copRunReady = buildCycle(copRun, SPRITES.copRun);
	Promise.all([nicoleReady, stellaReady]).then(() => walkers.classList.add('ready'));
	Promise.all([decodeImage(copImg), copRunReady]).then(() => copWrap.classList.add('ready'));
	// (and if a picture never decodes, show them anyway after a moment)
	setTimeout(() => { walkers.classList.add('ready'); copWrap.classList.add('ready'); }, 2000);

	// Where they are along the street, in percent; moved with transforms, so the browser glides
	// them even when the page's own thread is busy.
	let nicolePct = 20;
	let copPct = 2;
	function place() {
		const w = street.clientWidth;
		walkers.style.transform = 'translateX(' + (w * nicolePct / 100) + 'px)';
		copWrap.style.transform = 'translateX(' + (w * copPct / 100) + 'px)';
	}
	place();
	window.addEventListener('resize', place);

	// tips
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	let tipReadyAt = 0;   // when the tip now showing will have been up long enough to read
	let tipTimer = 0;
	function showTip() {
		const text = TIPS[tipIndex++ % TIPS.length];
		tip.style.opacity = 0;
		setTimeout(() => { tip.textContent = text; tip.style.opacity = 1; }, 350);
		tipReadyAt = performance.now() + 350 + readTime(text);
		// the next one comes no sooner than this one can be read (a long one outlasts the usual 4.5 s)
		tipTimer = setTimeout(() => { if (!finished) { showTip(); } }, 350 + Math.max(4500, readTime(text) + 500));
	}
	showTip();

	function mb(bytes) { return (bytes / 1048576).toFixed(1); }

	function setRow(id, value, state, detail) {
		const r = rows[id];
		r.value = Math.max(r.value, Math.min(1, value));
		r.state = state;
		r.row.className = 'row ' + (state === 'done' ? 'done active' : state === 'working' ? 'working active' : state === 'active' ? 'active' : '');
		const pct = state === 'working' ? 100 : Math.round(r.value * 100);
		r.fill.style.transform = 'scaleX(' + (pct / 100) + ')';
		r.bar.setAttribute('aria-valuenow', Math.round(r.value * 100));
		r.detail.textContent = detail;
		let total = 0;
		STAGES.forEach((k) => { total += WEIGHTS[k] * (rows[k].state === 'done' ? 1 : rows[k].value); });
		nicolePct = 20 + 62 * Math.min(total, 1);
		if (!copChasing && total > 0.22) { startChase(); }
		if (copChasing) { copPct = Math.max(2, nicolePct - 32); }
		place();
	}

	// engine and data: measured as they download
	const sizes = {};
	const loaded = { wasm: 0, pck: 0 };
	Object.keys(GODOT_CONFIG.fileSizes || {}).forEach((k) => {
		if (k.endsWith('.wasm')) { sizes.wasm = GODOT_CONFIG.fileSizes[k]; }
		if (k.endsWith('.pck')) { sizes.pck = GODOT_CONFIG.fileSizes[k]; }
	});
	function downloadUpdate() {
		if (sizes.wasm) {
			const f = Math.min(1, loaded.wasm / sizes.wasm);
			if (f < 1) {
				if (rows.engine.state !== 'done') { setRow('engine', f * 0.92, 'active', mb(loaded.wasm) + ' / ' + mb(sizes.wasm) + ' MB'); }
			} else if (rows.engine.state !== 'done') {
				setRow('engine', 0.92, 'working', 'starting up');
			}
		}
		if (sizes.pck) {
			const f = Math.min(1, loaded.pck / sizes.pck);
			if (f < 1) {
				setRow('data', f, 'active', mb(loaded.pck) + ' / ' + mb(sizes.pck) + ' MB');
			} else if (rows.data.state !== 'done') {
				setRow('data', 1, 'done', 'unpacked');
			}
		}
	}
	const realFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : ((input && input.url) || '');
		const key = url.split('?')[0].endsWith('.wasm') ? 'wasm' : url.split('?')[0].endsWith('.pck') ? 'pck' : null;
		const promise = realFetch(input, init);
		if (!key || typeof TransformStream === 'undefined') { return promise; }
		return promise.then((res) => {
			if (!res.body || !res.ok) { return res; }
			loaded[key] = 0;
			const counter = new TransformStream({
				transform(chunk, controller) { loaded[key] += chunk.byteLength; downloadUpdate(); controller.enqueue(chunk); }
			});
			return new Response(res.body.pipeThrough(counter), { status: res.status, statusText: res.statusText, headers: res.headers });
		});
	};
	setRow('engine', 0, 'active', 'connecting');

	// reports from the game while it builds the world
	const STAGE_TEXT = {
		sound: ['tuning', 'ready'],
		city: ['blocks', 'built'],
		streets: ['lights, cops', 'ready']
	};
	window.curfewBoot = function (stage, fraction) {
		if (rows.engine.state !== 'done') { setRow('engine', 1, 'done', 'running'); }
		if (rows.data.state !== 'done') { setRow('data', 1, 'done', 'unpacked'); }
		if (!rows[stage]) { return; }
		if (fraction >= 1) {
			setRow(stage, 1, 'done', STAGE_TEXT[stage][1]);
		} else {
			setRow(stage, fraction, 'active', Math.round(fraction * 100) + '%  ' + STAGE_TEXT[stage][0]);
		}
	};
	// The game asks this once it is built, before it starts: how many more milliseconds the page wants
	// it held so the tip showing can be read (0 to go). A fast start would otherwise take the page away
	// in a blink. Pressing a key or clicking, once the game is built, skips the wait.
	['keydown', 'pointerdown'].forEach((name) => {
		window.addEventListener(name, () => { if (rows.streets.state === 'done') { skipped = true; } });
	});
	window.curfewHold = function () {
		// never past 5.4 s from opening the page: a slow start has had a tip's time already
		const left = skipped || failed ? 0 : Math.min(tipReadyAt, startedAt + 5400) - performance.now();
		if (left > 0 && !holding) { clearTimeout(tipTimer); }  // the tip stays put while it is read
		holding = left > 0;
		slow.textContent = left > 1200 ? 'Press any key to go.' : '';
		return Math.max(0, left);
	};
	window.curfewReady = function () {
		if (finished) { return; }
		holding = false;
		slow.textContent = '';
		STAGES.forEach((id) => { setRow(id, 1, 'done', rows[id].detail.textContent.indexOf('%') >= 0 || rows[id].state !== 'done' ? 'ready' : rows[id].detail.textContent); });
		finished = true;
		boot.classList.add('home');
		tip.textContent = 'Home is the house with the lit door. Go.';
		tip.style.opacity = 1;
		nicolePct = 82;
		if (copChasing) { copPct = 50; }
		place();
		clearTimeout(tipTimer);
		setTimeout(() => { boot.classList.add('leaving'); }, 900);
		setTimeout(() => { boot.remove(); }, 1800);
	};

	// slow connections get an explanation
	const slowTimer = setInterval(() => {
		if (finished || failed) { clearInterval(slowTimer); return; }
		if (holding) { return; }  // (the page is saying "press any key" instead)
		const secs = (performance.now() - startedAt) / 1000;
		if (secs > 10 && rows.engine.state === 'active') {
			slow.textContent = 'Slow connection? The first visit is a ' + mb(sizes.wasm || 0) + ' MB download. After that it is cached and starts fast.';
		} else if (secs > 10 && rows.engine.state === 'working') {
			slow.textContent = 'Starting up. Older phones can take a few seconds here.';
		} else {
			slow.textContent = '';
		}
	}, 1000);

	function fail(err) {
		console.error(err);
		failed = true;
		const msg = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		notice.textContent = msg;
		notice.style.display = 'block';
		slow.textContent = '';
		boot.classList.add('failed');
	}

	// ---- start the game ---------------------------------------------------------------------
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser cannot run the game. Missing:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		'onProgress': function () { /* the page measures the downloads itself */ },
	}).then(() => {
		// The game reports the rest. If it never does (an older build), don't trap the player.
		setTimeout(() => { if (!finished) { window.curfewReady(); } }, 30000);
	}, fail);
}());
		</script>
	</body>
</html>
